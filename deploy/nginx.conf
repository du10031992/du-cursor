upstream meppanel_license {
    server license-server:8080;
}

# Chan dò OTP va spam SMS tu Internet.
limit_req_zone $binary_remote_addr zone=meppanel_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=meppanel_api:10m rate=240r/m;

server {
    listen 80;
    server_name license.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name license.your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 4m;

    # Trang quan tri: chi bao ve bang Admin API key nen han che theo IP.
    # Bo comment va thay bang IP/dai IP cua Admin truoc khi mo ra Internet.
    location /admin {
        # allow 203.0.113.10;      # IP tinh cua Admin
        # allow 10.8.0.0/24;       # dai VPN noi bo
        # deny all;

        proxy_pass http://meppanel_license;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dang nhap OTP: gioi han tan so de chan brute-force ma 6 chu so.
    location /api/Auth/ {
        limit_req zone=meppanel_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://meppanel_license;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=meppanel_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://meppanel_license;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
